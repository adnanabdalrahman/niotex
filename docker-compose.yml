# Runs the API + its own MySQL database in Docker.
# The MSSQL (CEOS) database is NOT in Docker: the API connects to the SQL Server
# running on the host machine via host.docker.internal.
#
#   docker compose up -d --build                    # API + MySQL
#   docker compose --profile worker up -d --build   # also start the queue worker

x-app: &app
  build: .
  image: ceosapi-niotix:latest
  env_file: .env
  environment: &app-env
    APP_URL: http://localhost:${APP_PORT:-8090}
    # API's own MySQL database (container below)
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DOCKER_DB_DATABASE:-niotex}
    DB_USERNAME: ${DOCKER_DB_USERNAME:-niotex}
    DB_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
    # CEOS SQL Server on the host machine (credentials come from .env)
    DB_HOST_SQLSRV: ${DOCKER_SQLSRV_HOST:-host.docker.internal}
  extra_hosts:
    - host.docker.internal:host-gateway
  volumes:
    - ./storage/logs:/var/www/html/storage/logs
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    ports:
      - "${APP_PORT:-8090}:80"

  # Processes queued jobs (e.g. RakLiegenschaftHistorySyncJob, which writes to MSSQL).
  # Off by default; start with: docker compose --profile worker up -d
  worker:
    <<: *app
    profiles: [worker]
    command: php artisan queue:work --tries=1 --timeout=3600
    depends_on:
      app:
        condition: service_started

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-niotex}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-niotex}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${DOCKER_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DOCKER_DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
